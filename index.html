<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>LaunchPad Agregador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { color-scheme: dark; }
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
        /* Custom scrollbar to be invisible but functional */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        /* Fix browser autofill bright background on dark glass inputs */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active,
        input:autofill,
        input:autofill:hover,
        input:autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            color: #ffffff !important;
            caret-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0 1000px rgba(24, 29, 41, 0.92) inset !important;
            box-shadow: 0 0 0 1000px rgba(24, 29, 41, 0.92) inset !important;
            border-color: rgba(255, 255, 255, 0.22) !important;
            transition: background-color 99999s ease-in-out 0s;
        }
    </style>
